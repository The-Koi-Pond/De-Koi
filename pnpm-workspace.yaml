# Install-time supply-chain guardrails. The root package is included by pnpm
# when no workspace package globs are specified.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Older locked transitive packages predate modern trusted publishing. Keep
# no-downgrade enforcement focused on releases from the last year.
trustPolicyIgnoreAfter: 525600
blockExoticSubdeps: true
strictDepBuilds: true

allowBuilds:
  esbuild: true
  puppeteer@24.43.1: true
  unrs-resolver: false
