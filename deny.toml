[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
unmaintained = "workspace"
# Temporary: tauri-plugin-devtools 2.1.0's opt-in dependency chain still uses
# tonic 0.10 -> hyper 0.14 -> h2 0.3.27. Default desktop and server/Pi builds do
# not enable the devtools feature. Remove when the plugin uses h2 >= 0.4.16.
ignore = ["RUSTSEC-2026-0258"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
private = { ignore = true }
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
