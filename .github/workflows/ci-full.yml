name: CI Full

# Repo-variable toggles:
# - DE_KOI_PR_SYNC_AUTOMATION=off skips full CI lanes for PR synchronize events.
# - DE_KOI_CI_FULL_MODE=full runs all full CI lanes instead of file classification.
#
# merge_group runs every lane on the merge queue's commit (main plus the queued
# pull requests), so Required Validation reports there before anything merges.
# One shortcut: when the queue's code is identical (same git tree) to the queued
# pull request's head, and that head's latest pull_request run passed every lane,
# the queue reuses that result instead of running the same checks again. If main
# moved on, or anything can't be confirmed, every lane runs as usual.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Change Classification
    runs-on: ${{ fromJSON(vars.DE_KOI_CI_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      # queue_reuse only writes outputs when it reuses a result, so it goes first.
      reused: ${{ steps.queue_reuse.outputs.reused || 'false' }}
      frontend: ${{ steps.queue_reuse.outputs.frontend || steps.non_pr.outputs.frontend || steps.sync_off.outputs.frontend || steps.full_mode.outputs.frontend || steps.classify.outputs.frontend }}
      rust: ${{ steps.queue_reuse.outputs.rust || steps.non_pr.outputs.rust || steps.sync_off.outputs.rust || steps.full_mode.outputs.rust || steps.classify.outputs.rust }}
      browser: ${{ steps.queue_reuse.outputs.browser || steps.non_pr.outputs.browser || steps.sync_off.outputs.browser || steps.full_mode.outputs.browser || steps.classify.outputs.browser }}
      docs: ${{ steps.queue_reuse.outputs.docs || steps.non_pr.outputs.docs || steps.sync_off.outputs.docs || steps.full_mode.outputs.docs || steps.classify.outputs.docs }}
    steps:
      - id: queue_reuse
        name: Reuse the pull request's result when the queue changes nothing
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          GROUP_SHA: ${{ github.event.merge_group.head_sha }}
        shell: bash
        run: |
          set -uo pipefail
          # Any doubt means a normal full run: print why and leave the outputs empty.
          full_run() {
            echo "$1 Running every lane."
            exit 0
          }

          [[ "$GROUP_REF" =~ /pr-([0-9]+)-[0-9a-f]+$ ]] || full_run "Can't tell which pull request this queue entry is for."
          PR="${BASH_REMATCH[1]}"
          PR_SHA="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)" || full_run "Couldn't read pull request #$PR."
          GROUP_TREE="$(gh api "repos/$REPO/git/commits/$GROUP_SHA" --jq .tree.sha)" || full_run "Couldn't read the queue commit."
          PR_TREE="$(gh api "repos/$REPO/git/commits/$PR_SHA" --jq .tree.sha)" || full_run "Couldn't read #$PR's head commit."
          if [ -z "$GROUP_TREE" ] || [ "$GROUP_TREE" != "$PR_TREE" ]; then
            full_run "The queue's code differs from #$PR's head (main moved on or other pull requests are ahead)."
          fi

          # The latest pull_request run of this workflow on that exact commit must have
          # finished successfully, with every lane run and passed (not skipped).
          RUN_ID="$(gh api "repos/$REPO/actions/workflows/ci-full.yml/runs?head_sha=$PR_SHA&event=pull_request&per_page=1" \
            --jq '.workflow_runs[0] | select(.status == "completed" and .conclusion == "success") | .id')" ||
            full_run "Couldn't read #$PR's CI runs."
          [ -n "$RUN_ID" ] || full_run "#$PR's latest CI run on this commit hasn't passed."
          PASSED="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "success") | .name]')" ||
            full_run "Couldn't read the jobs of run $RUN_ID."
          for job in "Deterministic Repository Gates" "Frontend Build and Size Budget" "Rust Capability Layer" "Browser Smoke and Performance" "Required Validation"; do
            jq -e --arg job "$job" 'index($job) != null' <<<"$PASSED" > /dev/null || full_run "Run $RUN_ID didn't pass \"$job\"."
          done

          echo "The queue's code is identical to #$PR's head $PR_SHA, and its run $RUN_ID passed every lane: reusing that result."
          {
            echo "reused=true"
            echo "frontend=false"
            echo "rust=false"
            echo "browser=false"
            echo "docs=false"
          } >> "$GITHUB_OUTPUT"

      - id: non_pr
        name: Route non-PR event
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo "frontend=true"
            echo "rust=true"
            echo "browser=true"
            echo "docs=true"
          } >> "$GITHUB_OUTPUT"

      - id: sync_off
        name: Route disabled PR update
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && vars.DE_KOI_PR_SYNC_AUTOMATION == 'off'
        shell: bash
        run: |
          echo "DE_KOI_PR_SYNC_AUTOMATION=off; skipping full CI lanes for this PR update."
          {
            echo "frontend=false"
            echo "rust=false"
            echo "browser=false"
            echo "docs=false"
          } >> "$GITHUB_OUTPUT"

      - id: full_mode
        name: Route full CI mode
        if: github.event_name == 'pull_request' && (vars.DE_KOI_CI_FULL_MODE == 'full' || vars.DE_KOI_CI_FULL_MODE == 'all')
        shell: bash
        run: |
          echo "DE_KOI_CI_FULL_MODE=${{ vars.DE_KOI_CI_FULL_MODE }}; running all full CI lanes."
          {
            echo "frontend=true"
            echo "rust=true"
            echo "browser=true"
            echo "docs=true"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: >
          github.event_name == 'pull_request' &&
          !(github.event.action == 'synchronize' && vars.DE_KOI_PR_SYNC_AUTOMATION == 'off') &&
          vars.DE_KOI_CI_FULL_MODE != 'full' &&
          vars.DE_KOI_CI_FULL_MODE != 'all'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify changed files
        if: >
          github.event_name == 'pull_request' &&
          !(github.event.action == 'synchronize' && vars.DE_KOI_PR_SYNC_AUTOMATION == 'off') &&
          vars.DE_KOI_CI_FULL_MODE != 'full' &&
          vars.DE_KOI_CI_FULL_MODE != 'all'
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse "${HEAD}^" 2>/dev/null || true)"
          fi

          if [ -z "$BASE" ] || ! git diff --name-only "$BASE" "$HEAD" > changed-files.txt; then
            echo "Unable to determine a precise diff; running all CI lanes."
            {
              echo "frontend=true"
              echo "rust=true"
              echo "browser=true"
              echo "docs=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          sed 's/^/- /' changed-files.txt

          matches() {
            grep -Eq "$1" changed-files.txt
          }

          broad=false
          frontend=false
          rust=false
          browser=false
          docs=false

          # Full circus: dependency, workflow, build config, and cross-boundary
          # changes are cheap to classify but expensive to get wrong.
          if matches '^(package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig(\.node)?\.json|vite\.config\.ts|vitest\.config\.ts|eslint\.config\.js|playwright\.config\.ts|lighthouserc\.cjs|knip\.json|rust-toolchain\.toml|deny\.toml|\.github/workflows/[^/]+\.yml|scripts/(run-vite|check-[^/]+|eslint-full-report)\.mjs)$'; then
            broad=true
          fi

          if matches '^(src-tauri/src/(commands/storage|http_(dispatch|server)|state)|src-tauri/crates/(assets|security)|src/engine/(agents-runtime|contracts|generation)/|src/shared/api/(agent|avatar|export|game|image-generation|import|integration-utility|local-file|lorebook-command|remote-runtime|storage|tracker-snapshot)-api\.ts|custom_components/)'; then
            broad=true
          fi

          if matches '^(src/(app|engine|features|shared|styles)/|src/[^/]+\.(ts|tsx|d\.ts|css)$|tests/unit/|src-tauri/resources/default-data/|public/|scripts/|index\.html$|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$|tsconfig(\.node)?\.json$|vite\.config\.ts$|vitest\.config\.ts$|eslint\.config\.js$|lighthouserc\.cjs$|knip\.json$)'; then
            frontend=true
          fi

          if matches '^(src-tauri/|deny\.toml|rust-toolchain\.toml|src/shared/api/|src/engine/contracts/|tests/unit/prompt-snapshots/deki\.txt$)'; then
            rust=true
          fi

          if matches '^(src/app/|src/features/|src/styles/|src/shared/(api/[^/]+-api\.ts|lib/(notification-sound|text-blip-sound)\.ts|stores/ui|types/)|public/|tests/e2e/|playwright\.config\.ts$|vite\.config\.ts$|index\.html$|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$)'; then
            browser=true
          fi

          if matches '^(AGENTS\.md$|CONTRIBUTING\.md$|README\.md$|docs/|skills/|\.agents/|\.github/agents/|\.github/pull_request_template\.md$|scripts/check-(docs|agent-workflow|discovery-metadata|workflow-names|scratch-clean|line-endings)\.mjs$)'; then
            docs=true
          fi

          if [ "$broad" = true ]; then
            frontend=true
            rust=true
            browser=true
            docs=true
          fi

          {
            echo "frontend=$frontend"
            echo "rust=$rust"
            echo "browser=$browser"
            echo "docs=$docs"
          } >> "$GITHUB_OUTPUT"

  frontend:
    name: Deterministic Repository Gates
    needs: classify
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.classify.outputs.reused != 'true'
    runs-on: ${{ fromJSON(vars.DE_KOI_CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reset self-hosted pnpm tool home
        if: runner.environment != 'github-hosted'
        run: rm -rf "$HOME/setup-pnpm"
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.33.2
      - name: Set up Node with pnpm cache
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Node without pnpm cache
        if: runner.environment != 'github-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Workflow metadata name check
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: pnpm check:workflow-names
      - name: Deterministic repository policy
        run: pnpm check:deterministic
      - name: Prettier format check
        run: pnpm format:check
      - if: needs.classify.outputs.frontend == 'true'
        run: pnpm lint
      - if: needs.classify.outputs.frontend == 'true'
        run: pnpm test:allow-empty
      - name: Unused code check
        if: needs.classify.outputs.frontend == 'true'
        run: pnpm check:unused

  build:
    name: Frontend Build and Size Budget
    needs: classify
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.classify.outputs.frontend == 'true'
    runs-on: ${{ fromJSON(vars.DE_KOI_CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reset self-hosted pnpm tool home
        if: runner.environment != 'github-hosted'
        run: rm -rf "$HOME/setup-pnpm"
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.33.2
      - name: Set up Node with pnpm cache
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Node without pnpm cache
        if: runner.environment != 'github-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # perf:size runs the production build before checking budgets.
      - run: pnpm perf:size

  rust:
    name: Rust Capability Layer
    needs: classify
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.classify.outputs.rust == 'true'
    runs-on: ${{ fromJSON(vars.DE_KOI_CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@v2.90.1
        with:
          tool: nextest,cargo-deny,cargo-machete
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --workspace
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings -A dead_code
      - run: cargo nextest run --manifest-path src-tauri/Cargo.toml --workspace
      - name: Rust advisory boundary policy
        run: node scripts/check-rust-advisory-boundaries.mjs
      - name: Rust dependency policy
        run: cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml check
      - name: Unused Rust dependency report
        run: cargo machete src-tauri
        continue-on-error: true

  smoke:
    name: Browser Smoke and Performance
    needs: classify
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.classify.outputs.browser == 'true'
    runs-on: ${{ fromJSON(vars.DE_KOI_CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - name: Reset self-hosted pnpm tool home
        if: runner.environment != 'github-hosted'
        run: rm -rf "$HOME/setup-pnpm"
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.33.2
      - name: Set up Node with pnpm cache
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Node without pnpm cache
        if: runner.environment != 'github-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui:run
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  required:
    name: Required Validation
    needs:
      - classify
      - frontend
      - rust
      - smoke
      - build
    if: always()
    runs-on: ${{ fromJSON(vars.DE_KOI_CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - name: Require every applicable validation lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          REUSED: ${{ needs.classify.outputs.reused }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_REQUIRED: ${{ needs.classify.outputs.frontend }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUST_REQUIRED: ${{ needs.classify.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          BROWSER_REQUIRED: ${{ needs.classify.outputs.browser }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$IS_DRAFT" = "true" ]; then
            echo "Draft pull request: merge validation is deferred until ready for review."
            exit 0
          fi
          [ "$CLASSIFY_RESULT" = "success" ]
          if [ "$EVENT_NAME" = "merge_group" ] && [ "$REUSED" = "true" ]; then
            echo "Merge queue: the code is identical to the pull request's head, whose run passed every lane."
            exit 0
          fi
          [ "$FRONTEND_RESULT" = "success" ]
          if [ "$FRONTEND_REQUIRED" = "true" ]; then
            [ "$BUILD_RESULT" = "success" ]
          fi
          if [ "$RUST_REQUIRED" = "true" ]; then
            [ "$RUST_RESULT" = "success" ]
          fi
          if [ "$BROWSER_REQUIRED" = "true" ]; then
            [ "$SMOKE_RESULT" = "success" ]
          fi
