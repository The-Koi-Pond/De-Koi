name: Release

# Builds a De-Koi release with signed updater bundles and a verified latest.json.
#
# - Manual dispatch from main: builds everything, then creates a DRAFT GitHub
#   release (tag vX.Y.Z from package.json). A maintainer reviews and publishes it;
#   publishing marks it Latest, which is what the in-app updater reads.
# - Pull requests that touch release files: the same build as a dry run, signed
#   with a throwaway key. No release is created and no real secrets are used.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel shown in the title and notes"
        required: true
        default: Beta
        type: choice
        options:
          - Beta
          - Stable
      release_notes:
        description: "What's new (markdown). Shown at the top of the release notes."
        required: false
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release/**
      - scripts/release-updater-manifest.mjs
      - src-tauri/tauri.release.conf.json
      - src-tauri/gen/android/app/build.gradle.kts

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.2"
  RELEASE_OVERLAY: src-tauri/tauri.release.conf.json

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      - name: Choose release or dry run
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "dry_run=true" >> "${GITHUB_OUTPUT}"
            echo "Dry run: builds and verifies everything, publishes nothing."
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "dry_run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Releases may only be built from main. Selected branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Check version and tag
        id: version
        shell: bash
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          if [ "${version}" != "${tauri_version}" ] || [ "${version}" != "${cargo_version}" ]; then
            echo "::error::Version mismatch: package.json ${version}, tauri.conf.json ${tauri_version}, Cargo.toml ${cargo_version}"
            exit 1
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release versions must be x.y.z (the updater and installers need plain numbers). Got ${version}"
            exit 1
          fi
          tag="v${version}"
          if [ "${DRY_RUN}" = "false" ] && git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists. Bump the version before releasing."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Release ${tag} from ${GITHUB_SHA}"

      - uses: pnpm/action-setup@v6.0.9
        if: steps.mode.outputs.dry_run == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        if: steps.mode.outputs.dry_run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Make a throwaway updater key (dry run)
        if: steps.mode.outputs.dry_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          mkdir -p "${RUNNER_TEMP}/dry-run-key"
          pnpm tauri signer generate --ci -p dry-run -w "${RUNNER_TEMP}/dry-run-key/updater.key"

      - name: Share the throwaway updater key (dry run)
        if: steps.mode.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-updater-key
          path: ${{ runner.temp }}/dry-run-key/
          if-no-files-found: error
          retention-days: 1

  build-desktop:
    name: Desktop ${{ matrix.slug }}
    runs-on: ${{ matrix.platform }}
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: windows-x64
            platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
          - slug: linux-x64
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            fakeroot \
            dpkg-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch the throwaway updater key (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/download-artifact@v7
        with:
          name: dry-run-updater-key
          path: ${{ runner.temp }}/dry-run-key

      - name: Build signed release bundles
        shell: bash
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          RUST_TARGET: ${{ matrix.rust_target }}
          BUNDLES: ${{ matrix.bundles }}
          DE_KOI_SOURCE_COMMIT: ${{ github.sha }}
          # Real keys only ever reach manual runs from main, never pull requests.
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          config_args=(--config "${RELEASE_OVERLAY}")
          if [ "${DRY_RUN}" = "true" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$(cat "${RUNNER_TEMP}/dry-run-key/updater.key")"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="dry-run"
            pubkey="$(cat "${RUNNER_TEMP}/dry-run-key/updater.key.pub")"
            printf '{"plugins":{"updater":{"pubkey":"%s"}}}' "${pubkey}" > "${RUNNER_TEMP}/dry-run-pubkey.json"
            config_args+=(--config "${RUNNER_TEMP}/dry-run-pubkey.json")
          elif [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set. Releases must ship signed updates."
            exit 1
          fi
          pnpm tauri build --ci "${config_args[@]}" --target "${RUST_TARGET}" --bundles "${BUNDLES}"

      - name: Collect release files
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          RUST_TARGET: ${{ matrix.rust_target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_dir="src-tauri/target/${RUST_TARGET}/release/bundle"
          mkdir -p release-assets
          collect() {
            local pattern="$1" name="$2"
            local matches=(${pattern})
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one ${pattern}, found ${#matches[@]}"
              exit 1
            fi
            cp "${matches[0]}" "release-assets/${name}"
            if [ -f "${matches[0]}.sig" ]; then
              cp "${matches[0]}.sig" "release-assets/${name}.sig"
            fi
          }
          case "${SLUG}" in
            windows-x64)
              collect "${bundle_dir}/nsis/*-setup.exe" "De-Koi_${VERSION}_windows-x64-setup.exe"
              ;;
            linux-x64)
              collect "${bundle_dir}/appimage/*.AppImage" "De-Koi_${VERSION}_linux-x64.AppImage"
              collect "${bundle_dir}/deb/*.deb" "De-Koi_${VERSION}_linux-x64.deb"
              ;;
          esac
          ls -la release-assets

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.slug }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Android arm64 APK
    runs-on: ubuntu-22.04
    needs: prepare
    permissions:
      contents: read
    env:
      ANDROID_RUST_TARGET: aarch64-linux-android
      ANDROID_TAURI_TARGET: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java for Android Gradle
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Install Rust stable with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.ANDROID_RUST_TARGET }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed release APK
        shell: bash
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Real keys only ever reach manual runs from main, never pull requests.
          KEYSTORE_BASE64: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/release-signing.jks"
          if [ "${DRY_RUN}" = "true" ]; then
            KEYSTORE_PASSWORD="dry-run-pass"
            KEY_ALIAS="dry-run"
            KEY_PASSWORD="dry-run-pass"
            keytool -genkeypair -keystore "${keystore}" -storetype JKS -keyalg RSA -keysize 2048 -validity 1 \
              -alias "${KEY_ALIAS}" -storepass "${KEYSTORE_PASSWORD}" -keypass "${KEY_PASSWORD}" -dname "CN=De-Koi dry run"
            # A dry run must carry its own throwaway certificate.
            keytool -list -v -keystore "${keystore}" -storepass "${KEYSTORE_PASSWORD}" -alias "${KEY_ALIAS}" \
              | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' > "${RUNNER_TEMP}/expected-cert.sha256"
          else
            for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::The ANDROID_${name} secret is not set. Releases must ship a signed APK."
                exit 1
              fi
            done
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            # A real release must carry the committed release certificate, the one
            # installed apps already trust for updates.
            cp .github/release/android-signing-cert.sha256 "${RUNNER_TEMP}/expected-cert.sha256"
          fi
          export DE_KOI_ANDROID_KEYSTORE_PATH="${keystore}"
          export DE_KOI_ANDROID_KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD}"
          export DE_KOI_ANDROID_KEY_ALIAS="${KEY_ALIAS}"
          export DE_KOI_ANDROID_KEY_PASSWORD="${KEY_PASSWORD}"
          status=0
          pnpm tauri android build --apk --ci --target "${ANDROID_TAURI_TARGET}" || status=$?
          rm -f "${keystore}"
          exit "${status}"

      - name: Collect and check the APK signature
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*' -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}: ${apks[*]:-none}"
            exit 1
          fi
          case "${apks[0]}" in
            *unsigned*)
              echo "::error::Gradle produced an unsigned APK: ${apks[0]}"
              exit 1
              ;;
          esac
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n 1)"
          report="$("${apksigner}" verify --verbose --print-certs "${apks[0]}")"
          echo "${report}"
          if ! grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" <<< "${report}"; then
            echo "::error::APK is not signed with APK Signature Scheme v2."
            exit 1
          fi
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "${report}")"
          expected="$(tr -d '[:space:]' < "${RUNNER_TEMP}/expected-cert.sha256")"
          if [ -z "${actual}" ] || [ "${actual}" != "${expected}" ]; then
            echo "::error::APK is signed by certificate ${actual:-none}, expected ${expected}. Check the ANDROID_* secrets."
            exit 1
          fi
          mkdir -p release-assets
          cp "${apks[0]}" "release-assets/De-Koi_${VERSION}_android-arm64.apk"
          ls -la release-assets

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-android-arm64
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: Build and verify latest.json
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-desktop
      - build-android
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Fetch the throwaway updater key (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/download-artifact@v7
        with:
          name: dry-run-updater-key
          path: ${{ runner.temp }}/dry-run-key

      - name: Build latest.json and check every signature
        shell: bash
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            pubkey="$(cat "${RUNNER_TEMP}/dry-run-key/updater.key.pub")"
          else
            # The key installed apps trust. Verifying against it catches a secret
            # that doesn't match the committed public key before anything ships.
            pubkey="$(node -p "require('./${RELEASE_OVERLAY}').plugins.updater.pubkey")"
          fi
          node scripts/release-updater-manifest.mjs build \
            --dir dist \
            --version "${VERSION}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            --notes "De-Koi ${VERSION}. Full notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --out dist/latest.json
          node scripts/release-updater-manifest.mjs verify --dir dist --manifest dist/latest.json --pubkey "${pubkey}"
          (cd dist && sha256sum -- * > "${RUNNER_TEMP}/SHA256SUMS.txt" && mv "${RUNNER_TEMP}/SHA256SUMS.txt" SHA256SUMS.txt)
          cat dist/latest.json
          cat dist/SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ inputs.channel || 'Beta' }}
          OPERATOR_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require("node:fs");
          const values = {
            VERSION: process.env.VERSION,
            TAG: process.env.TAG,
            CHANNEL: process.env.CHANNEL,
            CHANNEL_LOWER: process.env.CHANNEL.toLowerCase(),
            COMMIT: process.env.GITHUB_SHA,
            REPOSITORY: process.env.GITHUB_REPOSITORY,
            OPERATOR_NOTES: (process.env.OPERATOR_NOTES || "").trim(),
            WINDOWS_SIGNING:
              "Not Authenticode-signed yet, so Windows SmartScreen will warn. Choose More info, then Run anyway.",
          };
          const template = fs.readFileSync(".github/release/notes-template.md", "utf8");
          const notes = template.replace(/\{\{([A-Z_]+)\}\}/g, (match, key) => {
            if (!(key in values)) throw new Error(`unknown placeholder ${match}`);
            return values[key];
          });
          fs.writeFileSync("release-notes.md", notes.replace(/\n{3,}/g, "\n\n"));
          EOF
          cat release-notes.md

      - name: Upload final release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-final
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - manifest
    if: needs.prepare.outputs.dry_run == 'false'
    permissions:
      contents: write
    steps:
      - name: Download final release bundle
        uses: actions/download-artifact@v7
        with:
          name: release-final
          path: final

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          title="De-Koi ${VERSION}"
          if [ "${CHANNEL}" != "Stable" ]; then
            title="${title} (${CHANNEL})"
          fi
          # Draft: nothing is public, and installed apps see nothing, until a
          # maintainer reviews it and clicks Publish (which marks it Latest).
          url="$(gh release create "${TAG}" final/dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --latest \
            --target "${GITHUB_SHA}" \
            --title "${title}" \
            --notes-file final/release-notes.md)"
          echo "Draft release: ${url}"
          echo "Draft release ready for review: ${url}" >> "${GITHUB_STEP_SUMMARY}"
