# Dependabot configuration for De-Koi
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# One weekly "routine" pull request with minor and patch updates only. Major
# versions (TypeScript, Vite, Vitest, Node images, Actions...) are skipped here
# and upgraded on purpose as their own work: one breaking major in the shared
# group used to fail the whole bundle, so the safe updates never landed.
# Skipping Docker majors also keeps the images on Node 22, the version De-Koi
# targets.
version: 2
multi-ecosystem-groups:
  routine-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 1

updates:
  # pnpm workspace (root package.json + pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "routine-dependencies"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # Rust / Cargo workspace (Tauri backend)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    multi-ecosystem-group: "routine-dependencies"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "routine-dependencies"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Its refs name Rust versions (some not released yet), not action releases; the
      # Pi build's pin follows rust-toolchain.toml instead.
      - dependency-name: "dtolnay/rust-toolchain"
    cooldown:
      default-days: 7

  # Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/"
    multi-ecosystem-group: "routine-dependencies"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
